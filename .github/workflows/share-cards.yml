# Regenerates everything built from the events table: the per-event share
# stubs (e/<id>.html) so shared links unfurl into real cards, the crawlable
# pages (lineup/, tonight/, venues/<slug>/, sitemap.xml, robots.txt) so a
# search for what is on along 30A can find this site at all, and the partner
# strips (embed/<venue>/) a bar pastes into its own site.
#
# Scheduled a few minutes after each event import in the app repo (its
# scrape.yml: 10:13, 17:13 and 20:13 UTC) so fresh events get their pages
# the same day - the 20:35 run since 1 Oct 2026; before it nothing followed
# the evening import - plus one run meant for beach midnight: 05:10 UTC is
# 00:10 CDT and 23:10 CST, and tonightWindow rolls the last hour of the day
# forward for the winter one.
#
# These are the times asked for, not the times GitHub keeps. From 10 to 30
# Sep 2026 the 05:10 run never started before 09:13 UTC (4 to 6.5 hours
# late, every night), no scheduled run started between 21:27 and 09:12 UTC,
# and the imports' own :13 crons ran 2 to 6 hours late too. So no page counts
# on a run landing at a given hour: every row carries its end time and the
# page hides what has finished in the reader's browser, and /tonight/ says
# when its night is over (EXPIRE in scripts/site.mjs). A late run can also
# start while the previous one is still going; the concurrency group below
# queues it rather than letting both rebase the same pages onto each other.
#
# 02:47 is the hedge for the night, also since 1 Oct 2026, on a minute away
# from the top of the hour that GitHub's queue is busiest at. On time it is
# 9:47 PM CDT (8:47 PM CST), after the evening import even when that starts
# two hours late. Two to six and a half hours late, as these runs have been,
# it lands between 11:47 PM and 4:17 AM CDT, where tonightWindow already
# describes the new night (it rolls forward from 11 PM), so /tonight/ turns
# over hours before the morning run. Five runs of about 90 s a day, on a
# public repo's free minutes.
name: Share cards

on:
  schedule:
    - cron: '10 5 * * *'
    - cron: '20 10,17 * * *'
    - cron: '35 20 * * *'
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Publish even if the event count has collapsed (real off-season drop, not a bad fetch)'
        type: boolean
        default: false

# One refresh at a time; a second waits for the first rather than being cancelled.
concurrency:
  group: share-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The generator's pure functions, with no dependencies to install. A
      # failing test stops the run before a broken page reaches the site.
      - run: node --test scripts/site.test.mjs
      # The first run that keeps embed/published.json starts it partly from
      # git history: every venue page since the owner footer shipped whose
      # strip has gone since (readPublished in scripts/share-cards.mjs). The
      # checkout is one commit deep, so fetch the rest, on that run only -
      # about 17 MB on 1 Oct 2026. If the fetch fails the run goes on, and
      # share-cards.mjs warns that the list starts from the strips alone.
      - name: Fetch the history the first list of strips is read from
        if: hashFiles('embed/published.json') == ''
        run: git fetch --unshallow origin || echo "::warning::Could not fetch history for the first list of strips."
      - run: node scripts/share-cards.mjs
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
      - name: Commit if changed
        run: |
          git config user.name "30a-now-bot"
          git config user.email "actions@users.noreply.github.com"
          # embed/ includes published.json, the list of strips handed out.
          git add -A e lineup tonight venues embed sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Refresh event share cards and pages"
          # The app repo's Deploy web workflow pushes a new bundle here minutes
          # after every client merge, and a run takes 75-90 s from checkout to
          # push: a deploy inside that window made a bare push fail as
          # non-fast-forward, and the refresh was thrown away until the next
          # scheduled run. The deploy touches only the bundle, never the names
          # added above, so a rebase over it is clean. Both sides now retry.
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 15; done; exit 1
